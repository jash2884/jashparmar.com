<canvas id="c" aria-label="A room full of cats"></canvas>
<section class="box" style="left:32px;bottom:32px;width:350px">
<h1>Cat room</h1><p>Pick a toy, then use it anywhere in the room. Click a cat to stroke it.</p>
<div class="row" id="tools" role="group" aria-label="Toys"><button class="b" data-t="laser" aria-pressed="true">Laser</button><button class="b" data-t="yarn">Yarn</button><button class="b" data-t="treat">Treat</button><button class="b" data-t="box">Box</button></div>
<div class="row"><button class="b go" id="make">Make a cat</button><button class="b" id="pic">Take a photo</button></div>
</section>
<dialog id="maker" class="box"><h1>Make a cat</h1><label for="nm">Its name</label><input id="nm" type="text" maxlength="14" autocomplete="off" /><div class="row" id="coats" role="group" aria-label="Coat" style="margin:16px 0"></div><div class="row"><button class="b go" id="add">Let it in</button><button class="b" id="no">Not now</button></div></dialog>
<p class="plain">This room needs 3D, and this browser has it turned off.</p>
